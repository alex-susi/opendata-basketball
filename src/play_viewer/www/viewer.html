<section class="viewer">
  <!-- Title on the left, then the running clocks beside the score, which sits over the middle of the court. -->
  <header class="play-head">
    <div class="play-head-lead">
      <div class="play-head-text">
        <h1 id="play-title">Loading plays…</h1>
        <p id="play-sub"></p>
      </div>
      <div class="game-clock" id="game-clock"></div>
    </div>
    <div class="scorebug" id="scorebug"></div>
  </header>

  <div class="stage" id="stage">
    <canvas id="court" aria-label="Animated court view of the selected possession"></canvas>
    <div class="stage-note" id="stage-note" hidden></div>
  </div>

  <div class="transport">
    <button type="button" class="icon-btn" id="btn-prev" title="Previous action">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
    </button>
    <button type="button" class="icon-btn primary" id="btn-play" title="Play or pause (space)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path id="play-glyph" d="M7 4v16l13-8z"/></svg>
    </button>
    <button type="button" class="icon-btn" id="btn-next" title="Next action">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>
    </button>
    <div class="track" id="track" role="slider" aria-label="Position in the possession" tabindex="0">
      <div class="track-rail">
        <div class="track-fill" id="track-fill"></div>
        <div class="track-ticks" id="track-ticks"></div>
      </div>
      <div class="track-labels" id="track-labels"></div>
      <div class="track-thumb" id="track-thumb"></div>
    </div>
    <div class="transport-end">
      <select id="speed" title="Playback speed" aria-label="Playback speed">
        <option value="0.25">0.25×</option>
        <option value="0.5">0.5×</option>
        <option value="0.75">0.75×</option>
        <option value="1" selected>1×</option>
        <option value="1.25">1.25×</option>
        <option value="1.5">1.5×</option>
        <option value="2">2×</option>
      </select>
      <span class="time-label" id="time-label">0:00 / 0:00</span>
    </div>
  </div>
</section>

<aside class="side">
  <div class="panel display">
    <div class="panel-head">
      <h2>Display</h2>
      <button type="button" class="text-btn" id="btn-export" title="Record this play once through and save it as a video">Save Video</button>
    </div>
    <div class="hull-row">
      <div>
        <label class="toggle"><input type="checkbox" id="opt-off-hull" class="off" checked>Offensive hull</label>
        <label class="toggle"><input type="checkbox" id="opt-def-hull" class="def" checked>Defensive hull</label>
      </div>
      <label class="switch" title="Show only the half the offense attacks">
        <input type="checkbox" role="switch" id="opt-half"><span class="switch-track"></span>Half court
      </label>
    </div>
    <div class="toggle-grid">
      <label class="toggle"><input type="checkbox" id="opt-skip" checked>Skip dead ball</label>
      <label class="toggle"><input type="checkbox" id="opt-loop" checked>Loop</label>
      <label class="toggle wide"><input type="checkbox" id="opt-extrap">Mark extrapolated positions</label>
    </div>
  </div>

  <div class="panel display epv">
    <h2>Expected Possession Value</h2>
    <div class="readout" id="readout" title="EPV, turnover odds for the rest of the possession, cumulative turnover risk so far" hidden>
      <div><span>EPV</span><b id="readout-0">–</b></div>
      <div><span>TOV% (ROP)</span><b id="readout-1">–</b></div>
      <div><span>Cum. TOV</span><b id="readout-2">–</b></div>
    </div>
    <label class="toggle"><input type="checkbox" id="opt-epv" checked>Show EPV overlay</label>
    <div class="toggle-grid" id="epv-options">
      <label class="toggle" title="EPV, turnover odds for the rest of the possession, cumulative turnover risk so far"><input type="checkbox" id="opt-readout" checked>Readout</label>
      <label class="toggle" title="Value of a pass to each teammate, coloured against current EPV, and the EPV under the ball handler"><input type="checkbox" id="opt-pass-values" checked>Pass values</label>
      <label class="toggle" title="Chance each pass is turned over"><input type="checkbox" id="opt-pass-tov" checked>Pass TOV %</label>
      <label class="toggle" title="Chance the possession is lost in the next two seconds"><input type="checkbox" id="opt-ball-tov" checked>Ball TOV risk</label>
      <label class="toggle" title="Value of shooting now against the best available pass"><input type="checkbox" id="opt-shot-pass" checked>Shot / pass</label>
      <label class="toggle" title="Line to the most valuable pass"><input type="checkbox" id="opt-best-pass" checked>Best pass</label>
    </div>
    <p class="note" id="epv-missing" hidden>No EPV prices for this play. Run src/epv/build_epv.R to build them.</p>
  </div>

  <div class="panel roster off">
    <h2><span class="role">Offense</span><span class="team" id="team-off"></span></h2>
    <ul id="roster-off"></ul>
    <p class="hull-area" id="area-off"></p>
  </div>

  <div class="panel roster def">
    <h2><span class="role">Defense</span><span class="team" id="team-def"></span></h2>
    <ul id="roster-def"></ul>
    <p class="hull-area" id="area-def"></p>
  </div>
</aside>
